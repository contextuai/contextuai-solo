name: Sync Living Model Catalog

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx

      - name: Discover newly trending verified GGUF models
        run: python backend/scripts/sync_catalog_json.py

      - name: Commit updated catalog/models.json if changed
        run: |
          if git diff --quiet catalog/models.json; then
            echo "No new catalog updates today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/models.json
          git commit -m "chore(catalog): daily sync of trending GGUF models"
          git push
